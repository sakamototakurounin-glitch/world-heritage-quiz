<style>

.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;margin-bottom:7px}.box{background:#09192b;border:1px solid #ffffff12;border-radius:14px;padding:8px 10px}.p2{text-align:right}.score{font-size:24px;font-weight:950}.mid{text-align:center;min-width:120px;font-size:12px}.mid small{color:var(--m)}.bar{height:6px;background:#ffffff12;border-radius:99px;overflow:hidden;margin-bottom:10px}.fill{height:100%;background:linear-gradient(90deg,var(--b),var(--a));width:100%}.meta{display:flex;justify-content:space-between;align-items:flex-end;color:var(--a);font-weight:900}.meta #category{font-size:clamp(20px,5vw,28px);font-weight:950;line-height:1.1}.meta #modeLabel{font-size:10px;color:var(--m)}

@keyframes titleIn{0%{opacity:0;transform:translateY(-12px) scale(.82);filter:blur(5px)}62%{opacity:1;transform:translateY(2px) scale(1.06);filter:blur(0)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes titleGlow{0%{text-shadow:0 0 0 transparent}35%{text-shadow:0 0 20px #5eead4aa}100%{text-shadow:0 0 0 transparent}}
#gameCard.feedbackCorrect{animation:correctPop .72s cubic-bezier(.16,1,.3,1)}
#gameCard.feedbackWrong{animation:wrongShake .58s ease}
@keyframes correctPop{0%{transform:scale(1);box-shadow:0 15px 50px #0005}28%{transform:scale(1.018);box-shadow:0 0 0 2px #34d399aa,0 0 42px #34d39966,0 15px 50px #0005}100%{transform:scale(1);box-shadow:0 15px 50px #0005}}
@keyframes wrongShake{0%,100%{transform:translateX(0);box-shadow:0 15px 50px #0005}15%{transform:translateX(-8px);box-shadow:0 0 0 2px #fb7185aa,0 0 35px #fb718555}30%{transform:translateX(7px)}45%{transform:translateX(-5px)}60%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.status.correctAction{color:var(--g);animation:statusPop .58s cubic-bezier(.16,1,.3,1)}
.status.wrongAction{color:var(--r);animation:statusPop .58s cubic-bezier(.16,1,.3,1)}
@keyframes statusPop{0%{opacity:.2;transform:scale(.8)}55%{opacity:1;transform:scale(1.13)}100%{opacity:1;transform:scale(1)}}
.playerState{height:13px;margin-top:1px;font-size:10px;font-weight:950;color:var(--a);opacity:0;transition:opacity .18s}
.box{transition:opacity .2s,transform .2s,border-color .2s,box-shadow .2s}
.box.answering{position:relative;z-index:4;transform:scale(1.08);border-color:#5eead4aa;animation:answeringPulse .72s ease-in-out infinite alternate}
.box.answering .playerState{opacity:1}
.box.waiting{opacity:.40;transform:scale(.95)}
@keyframes answeringPulse{
 from{box-shadow:0 0 0 1px #5eead455,0 0 10px #5eead433}
 to{box-shadow:0 0 0 3px #5eead4aa,0 0 34px #5eead477}
}
.meta{min-height:54px;position:relative;overflow:visible}
.meta #category{position:relative;z-index:5;transform-origin:left center}
.meta #category.titleIn{animation:megaTitle 1.0s cubic-bezier(.16,1,.3,1),megaGlow 1.2s ease-out}
@keyframes megaTitle{
 0%{opacity:0;transform:translateY(30px) scale(.22);filter:blur(10px)}
 34%{opacity:1;transform:translateY(-12px) scale(1.85);filter:blur(0)}
 62%{transform:translateY(5px) scale(1.28)}
 82%{transform:translateY(-2px) scale(1.10)}
 100%{transform:translateY(0) scale(1)}
}
@keyframes megaGlow{
 0%{text-shadow:0 0 0 transparent}
 38%{text-shadow:0 0 28px #5eead4dd,0 0 58px #22d3ee88}
 100%{text-shadow:0 0 0 transparent}
}
.q.questionWait{opacity:0;transform:translateY(10px)}
.q.questionGo{animation:questionEnter .36s ease-out}
@keyframes questionEnter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.q{font-size:clamp(23px,4.8vw,36px);font-weight:950;line-height:1.5;min-height:145px;display:flex;align-items:center;margin:4px 0 10px;white-space:pre-wrap}.cursor:after{content:"▋";color:var(--a);animation:bl .8s infinite}@keyframes bl{50%{opacity:.15}}

@media(max-width:650px){.w{padding:6px}.card{padding:12px}.home{height:calc(100svh - 39px);min-height:0}.home h1{font-size:36px;margin:1px 0 12px}.set{padding:7px}.pick{padding:10px 6px}.hud{grid-template-columns:1fr 1fr}.mid{grid-column:1/-1;grid-row:1}.box:first-child,.box:last-child{grid-row:2}.q{min-height:155px}.buzz{min-height:84px}}
</style></head><body><div class="w">
<div class="top"><div class="brand">WORLD HERITAGE BUZZ</div><div class="tag">QUIZ</div></div>
<section id="home" class="card home">
<h1>世界遺産早押し</h1>
<div id="settingsGrid" class="settings">
<label class="set">問題数<select id="roundCount"><option>10</option><option selected>20</option><option>30</option><option>50</option><option>100</option></select></label>
<label id="buzzLimitSet" class="set">早押し<select id="buzzLimit"><option value="5">5秒</option><option value="8" selected>8秒</option><option value="12">12秒</option><option value="0">なし</option></select></label>
<label id="charSpeedSet" class="set">表示速度<select id="charSpeed"><option value="100">早い</option><option value="125" selected>普通</option><option value="150">遅い</option></select></label>
</div>
<div class="label">回答モード</div><div class="modes"><button id="modeInput" class="pick active" onclick="selectAnswerMode('input')">早押し</button><button id="modeChoice" class="pick" onclick="selectAnswerMode('choice')">学習</button></div>
<div id="playerLabel" class="label">人数</div><div id="playerButtons" class="players"><button id="oneP" class="pick active" onclick="selectPlayers(1)">1人</button><button id="twoP" class="pick" onclick="selectPlayers(2)">2人</button></div>
<button class="start" onclick="startGame()">START</button>
</section>
<section id="game" class="hide">
<div class="hud"><div id="p1hud" class="box"><span id="p1name">PLAYER 1</span><div id="p1state" class="playerState"></div><div id="s1" class="score">0</div></div><div class="box mid"><b id="round"></b><br><small id="phase"></small></div><div id="p2hud" class="box p2"><span>PLAYER 2</span><div id="p2state" class="playerState"></div><div id="s2" class="score">0</div></div></div>
<div id="gameCard" class="card"><div class="bar"><div id="fill" class="fill"></div></div><div class="meta"><span id="category"></span><span id="modeLabel"></span></div><div id="question" class="q cursor"></div>
<div id="buzzGrid" class="buzzgrid"><button id="buzz1" class="buzz b1" onclick="buzz(1)">PLAYER 1</button><button id="buzz2" class="buzz b2" onclick="buzz(2)">PLAYER 2</button></div><div id="status" class="status">早押し！</div>
<div id="choices" class="choices hide"></div><div id="charBox" class="charbox hide"><div id="slots" class="slots"></div><div id="charChoices" class="chars"></div></div>
<div id="exp" class="exp hide"></div><div id="next" class="next hide"><button class="small" onclick="nextQuestion()">次へ</button><button class="small" onclick="finish()">終了</button></div></div>
</section>
<section id="result" class="card result hide"><h2 id="resultTitle">RESULT</h2><div id="resultBody"></div><div class="next"><button class="start" onclick="startGame()">もう一度</button><button class="small" onclick="goHome()">戻る</button></div></section>

tegory":"2級演習","type":"study","modes":["choice"]},{"q":"サンギラン遺跡で重要な研究対象となった化石人類は？","answer":"ジャワ原人","pool":["ネアンデルタール人","クロマニョン人","北京原人"],"explanation":"正解はジャワ原人。サンギランではホモ・エレクトスに関する多くの化石や地層資料が見つかり、人類進化を研究するうえで重要な遺跡となっている。","category":"2級演習","type":"study","modes":["choice"]},{"q":"古代都市テーベでアメン神信仰の中心となった大神殿は？","answer":"カルナク神殿","pool":["フィラエ神殿","アブ・シンベル神殿","ホルス神殿"],"explanation":"正解はカルナク神殿。テーベでアメン神信仰の中心となった大規模神殿群で、複数の王朝にわたって増築された。ルクソール神殿もテーベを代表するが、両者を混同しない。","category":"2級演習","type":"study","modes":["choice"]},{"q":"ハットゥシャの王宮跡から大量に出土した粘土板に使われた文字は？","answer":"楔形文字","pool":["甲骨文字","ヒエログリフ","線文字B"],"explanation":"正解は楔形文字。ヒッタイト王国の都ハットゥシャでは、行政・外交・宗教などを記した大量の粘土板文書が見つかっている。ヒッタイトは西アジアの国際関係を知る重要な史料を残した。","category":"2級演習","type":"study","modes":["choice"]},{"q":"テオティワカンのラ・シウダデラにある代表的な神殿は？","answer":"ケツァルコアトル神殿","pool":["太陽神殿","ヴィラコチャ神殿","インティ神殿"],"explanation":"正解はケツァルコアトル神殿。ラ・シウダデラはテオティワカンの大規模な儀礼空間で、その中心部に羽毛の蛇神に関わる神殿がある。太陽のピラミッド、月のピラミッドとは別の建造物。","category":"2級演習","type":"study","modes":["choice"]},{"q":"シーギリヤに5世紀の城塞都市を築いた王は？","answer":"カッサパ1世","pool":["アショーカ王","パラクラマバーフ1世","ドゥトゥガムヌ王"],"explanation":"正解はカッサパ1世。5世紀、巨大な岩山シーギリヤを利用して王宮・城塞を築いた。岩山の中腹には女性像の壁画が残り、頂上部には宮殿跡がある。","category":"2級演習","type":"study","modes":["choice"]},{"q":"ラホール城を大規模に整備したムガル帝国の皇帝は？","answer":"アクバル帝","pool":["アウラングゼーブ帝","バーブル","フマーユーン"],"explanation":"正解はアクバル帝。現在のラホール城の主要な整備は16世紀後半、ムガル帝国のアクバル帝の時代に進んだ。その後の皇帝たちも宮殿や庭園を加えている。","category":"2級演習","type":"study","modes":["choice"]},{"q":"ラヴェンナでユスティニアヌス帝時代のモザイクで有名な聖堂は？","answer":"サン・ヴィターレ聖堂","pool":["サン・マルコ聖堂","サンタ・クローチェ聖堂","サン・ピエトロ聖堂"],"explanation":"正解はサン・ヴィターレ聖堂。ユスティニアヌス帝と皇后テオドラを描いたモザイクで特に有名で、西ヨーロッパに残るビザンツ美術の代表例。","category":"2級演習","type":"study","modes":["choice"]},{"q":"アルルでロマネスク彫刻の「最後の審判」で知られる聖堂は？","answer":"サン・トロフィーム聖堂","pool":["サン・ドニ聖堂","サン・セルナン聖堂","サンタ・マリア聖堂"],"explanation":"正解はサン・トロフィーム聖堂。正面入口の彫刻、とくに『最後の審判』を主題とする装飾はフランス・ロマネスク美術の代表例として重要。","category":"2級演習","type":"study","modes":["choice"]},{"q":"ケルン大聖堂の建設開始時に中心的役割を担った建築家は？","answer":"ゲルハルト","pool":["ノイマン","シンケル","フィッシャー・フォン・エアラッハ"],"explanation":"正解はゲルハルト。ケルン大聖堂は1248年に建設が始まり、フランスの盛期ゴシック建築の影響を受けた。建設は長期間中断し、完成は19世紀の1880年。","category":"2級演習","type":"study","modes":["choice"]},{"q":"バレッタを築き、マルタを拠点とした騎士団は？","answer":"聖ヨハネ騎士団","pool":["テンプル騎士団","ドイツ騎士団","キリスト騎士団"],"explanation":"正解は聖ヨハネ騎士団。1565年のオスマン帝国による大包囲をしのいだ後、新たな要塞都市バレッタを建設した。都市名は当時の騎士団長ジャン・ド・ラ・ヴァレットに由来する。","category":"2級演習","type":"study","modes":["choice"]},{"q":"カステル・デル・モンテを築いた神聖ローマ皇帝は？","answer":"フリードリヒ2世","pool":["オットー1世","カール4世","ハインリヒ4世"],"explanation":"正解はフリードリヒ2世。13世紀に築かれた城で、八角形の平面と8つの八角形の塔を持つ独特な幾何学構成が特徴。軍事城塞だけでは説明しきれない象徴的建築として知られる。","category":"2級演習","type":"study","modes":["choice"]},{"q":"ジェロニモス修道院を特徴づけるポルトガル独自の建築様式は？","answer":"マヌエル様式","pool":["ムデハル様式","チューダー様式","プラテレスコ様式"],"explanation":"正解はマヌエル様式。大航海時代のポルトガルで発達し、ロープ、海洋、植物などを思わせる豪華な装飾を特徴とする。ベレンの塔にも同様の様式が見られる。","category":"2級演習","type":"study","modes":["choice"]},{"q":"ベルゲンのブリッゲン地区がハンザ同盟の拠点として発展した主要交易品は？","answer":"干鱈","pool":["オリーブ油","絹織物","香辛料"],"explanation":"正解は干鱈。ベルゲンはハンザ商人の交易拠点となり、北ノルウェー産の干鱈などを輸出して発展した。ブリッゲンには木造の商館群が残る。","category":"2級演習","type":"study","modes":["choice"]},{"q":"隊商都市ペトラを築いた民族は？","answer":"ナバテア人","pool":["ヒッタイト人","フェニキア人","シュメール人"],"explanation":"正解はナバテア人。ペトラはアラビア半島と地中海世界を結ぶ隊商交易で栄えた。岩壁を削って造った建築と、乾燥地で水を確保する高度な水管理技術でも知られる。","category":"2級演習","type":"study","modes":["choice"]},{"q":"ストラスブールに本会議場が置かれているEUの機関は？","answer":"欧州議会","pool":["欧州中央銀行","欧州委員会","欧州司法裁判所"],"explanation":"正解は欧州議会。欧州議会はストラスブールで本会議を開く。ストラスブールには欧州評議会も置かれるが、欧州評議会はEUの機関ではない点に注意。","category":"2級演習","type":"study","modes":["choice"]},{"q":"アルハンブラ宮殿を最盛期に整備したイスラーム王朝は？","answer":"ナスル朝","pool":["ウマイヤ朝","アッバース朝","ファーティマ朝"],"explanation":"正解はナスル朝。イベリア半島最後のイスラーム王朝で、グラナダを都とした。アルハンブラ宮殿の精緻な装飾や中庭はナスル朝宮廷文化を代表する。","category":"2級演習","type":"study","modes":["choice"]},{"q":"サンスーシ宮殿を代表する建築様式は？","answer":"ロココ様式","pool":["ロマネスク様式","ゴシック様式","ブルータリズム"],"explanation":"正解はロココ様式。プロイセン王フリードリヒ2世がポツダムに築いた離宮で、軽快で優美な装飾をもつ。サンスーシはフランス語で『憂いなし』を意味する。","category":"2級演習","type":"study","modes":["choice"]},{"q":"バーミヤンの仏教美術に強く見られる文化的影響は？","answer":"ガンダーラ美術","pool":["アステカ美術","エトルリア美術","ミノア美術"],"explanation":"正解はガンダーラ美術。バーミヤンはシルクロード上の文化交流地点で、インド、イラン、ヘレニズム系など複数の文化の影響が仏教美術に表れている。","category":"2級演習","type":"study","modes":["choice"]},{"q":"プリトヴィツェ湖群の湖や天然ダムの形成に深く関わる物質は？","answer":"炭酸カルシウム","pool":["塩化ナトリウム","二酸化ケイ素","硫化鉄"],"explanation":"正解は炭酸カルシウム。石灰岩地域を流れる水から炭酸カルシウムが沈殿し、石灰華の天然ダムをつくることで多数の湖や滝が形成される。","category":"2級演習","type":"study","modes":["choice"]},{"q":"エヴァーグレーズで水面よりわずかに高い樹林性の小島を何という？","answer":"ハンモック","pool":["フィンボス","パンパ","ツンドラ"],"explanation":"正解はハンモック。広大な湿地の中でわずかに標高が高く、樹木がまとまって生える場所を指す。エヴァーグレーズの多様な微地形の一つ。","category":"2級演習","type":"study","modes":["choice"]},{"q":"ケープ植物区保護地域群を特徴づける低木植生は？","answer":"フィンボス","pool":["タイガ","マキ","パンパ"],"explanation":"正解はフィンボス。南アフリカのケープ地方に特徴的な硬葉低木植生で、非常に高い植物固有性と種多様性を持つことがこの自然遺産の重要な価値。","category":"2級演習","type":"study","modes":["choice"]},{"q":"シャーク湾を代表する大型海生哺乳類は？","answer":"ジュゴン","pool":["セイウチ","ラッコ","マナティー"],"explanation":"正解はジュゴン。シャーク湾には広大な海草藻場があり、世界的に重要なジュゴン生息地となっている。現生ストロマトライトでも有名。","category":"2級演習","type":"study","modes":["choice"]},{"q":"エルサレムの「嘆きの壁」が特に重要な聖地となっている宗教は？","answer":"ユダヤ教","pool":["仏教","ヒンドゥー教","ゾロアスター教"],"explanation":"正解はユダヤ教。嘆きの壁は神殿の丘を支える外壁の一部で、ユダヤ教の重要な祈りの場所。エルサレムはキリスト教・イスラームにとっても重要な聖地。","category":"2級演習","type":"study","modes":["choice"]},{"q":"バチカン宮殿の『アテナイの学堂』を描いた画家は？","answer":"ラファエロ","pool":["ティツィアーノ","ボッティチェリ","カラヴァッジョ"],"explanation":"正解はラファエロ。『アテナイの学堂』はバチカン宮殿の署名の間に描かれ、プラトンやアリストテレスなど古代の哲学者を集めた盛期ルネサンスの代表作。","category":"2級演習","type":"study","modes":["choice"]},{"q":"システィーナ礼拝堂の天井画をミケランジェロに依頼した教皇は？","answer":"ユリウス2世","pool":["レオ10世","ウルバヌス2世","インノケンティウス3世"],"explanation":"正解はユリウス2世。ミケランジェロは1508〜1512年に天井画を制作した。後に祭壇壁へ描いた『最後の審判』とは制作時期も依頼した教皇も区別する。","category":"2級演習","type":"study","modes":["choice"]},{"q":"プラハのカレル橋が架かる川は？","answer":"ヴルタヴァ川","pool":["セーヌ川","テムズ川","ドナウ川"],"explanation":"正解はヴルタヴァ川。カレル橋はプラハ旧市街とマラー・ストラナ側を結ぶ石橋で、14世紀にカレル4世の時代に建設が始まった。","category":"2級演習","type":"study","modes":["choice"]},{"q":"パリのポン・ヌフという名称の意味は？","answer":"新しい橋","pool":["王の橋","石の橋","島の橋"],"explanation":"正解は『新しい橋』。Pont Neufはフランス語でその意味だが、現在ではパリに現存する最古の橋として知られるため、名称と現在の位置づけの対比がポイント。","category":"2級演習","type":"study","modes":["choice"]},{"q":"モヘンジョ・ダーロの都市構造を特徴づけるものは？","answer":"計画的な街路網","pool":["放射状の城壁都市","水上住居を中心とする集落","遊牧民の移動集落"],"explanation":"正解は計画的な街路網。道路が整然と配置され、高度な排水設備や『大浴場』などを備える。インダス文明の高度な都市計画を示す代表的遺跡。","category":"2級演習","type":"study","modes":["choice"]},{"q":"北海道・北東北の縄文遺跡群が示す暮らしの特徴として適切なのは？","answer":"農耕を基盤としない定住生活","pool":["騎馬遊牧を中心とする生活","大規模稲作国家の成立","地中海交易による都市生活"],"explanation":"正解は農耕を基盤としない定住生活。採集・漁労・狩猟を基盤としながら長期間定住した社会と、祭祀や墓制を含む精神文化を示す17の構成資産からなる。","category":"2級演習","type":"study","modes":["choice"]},{"q":"雲岡石窟の初期造像に影響を与えたとされる地域の美術は？","answer":"ガンダーラやグプタ朝の美術","pool":["マヤ文明の美術","エトルリア美術","ロマネスク美術"],"explanation":"正解はガンダーラやグプタ朝の美術。初期の曇曜五窟などには西方・インド系仏教美術の影響が見られ、その後の造像では中国的な様式が強まっていく。","category":"2級演習","type":"study","modes":["choice"]},{"q":"テオティワカンの都市計画で中心軸となる大通りは？","answer":"死者の大通り","pool":["王の道","アッピア街道","聖なる道"],"explanation":"正解は死者の大通り。南北に延びるこの大通りを軸に、太陽のピラミッド、月のピラミッドなど主要な祭祀建造物が配置されている。","category":"2級演習","type":"study","modes":["choice"]},{"q":"アルハンブラ宮殿とともに登録される離宮は？","answer":"ヘネラリーフェ","pool":["エスコリアル","アルカサル","メディナ・アサーラ"],"explanation":"正解はヘネラリーフェ。ナスル朝王族の離宮・庭園で、アルハンブラ宮殿、アルバイシン地区とともにグラナダの世界遺産を構成する。","category":"2級演習","type":"study","modes":["choice"]},{"q":"ペトラの繁栄を支えた主要な役割は？","answer":"隊商交易の中継地","pool":["大西洋捕鯨基地","稲作農業の中心","北海漁業基地"],"explanation":"正解は隊商交易の中継地。香料などを運ぶアラビア半島と地中海世界の交易路上に位置し、ナバテア人はその立地と水管理技術を生かして都市を発展させた。","category":"2級演習","type":"study","modes":["choice"]},{"q":"カステル・デル・モンテの平面形で特徴的なのは？","answer":"八角形","pool":["円形","十字形","正三角形"],"explanation":"正解は八角形。建物本体が八角形で、中央に八角形の中庭を置き、各角にも八角形の塔が立つ。『フリードリヒ2世＋八角形』をセットで押さえたい遺産。","category":"2級演習","type":"study","modes":["choice"]},{"q":"ブリッゲン地区があるノルウェーの都市は？","answer":"ベルゲン","pool":["オスロ","トロンハイム","スタヴァンゲル"],"explanation":"正解はベルゲン。ブリッゲンはベルゲン旧港に並ぶ木造商館群で、中世からハンザ同盟の交易拠点として繁栄した。主要交易品の一つが干鱈。","category":"2級演習","type":"study","modes":["choice"]}];

  $("oneP").classList.add("active");$("twoP").classList.remove("active");
 }
 $("playerLabel").classList.toggle("hide",learning);
 $("playerButtons").classList.toggle("hide",learning);
 $("buzzLimitSet").classList.toggle("hide",learning);
 $("charSpeedSet").classList.toggle("hide",learning);
 $("settingsGrid").classList.toggle("choiceOnly",learning);
}
function selectPlayers(n){
 if(answerMode==="choice")return;
 players=n;
 $("oneP").classList.toggle("active",n===1);
 $("twoP").classList.toggle("active",n===2);
}
function norm(s){return(s||"").normalize("NFKC").toLowerCase().replace(/[・･·,，、。．.\s'"「」『』（）()\[\]【】＝=／/:：―-]/g,"")}
function buildDeck(n){const p=BANK.filter(q=>(q.modes||[]).includes(answerMode));return sh(p.slice()).slice(0,Math.min(n,p.length))}
function clearTimers(){clearInterval(revealTimer);clearInterval(buzzTimer);clearInterval(answerTimer);clearTimeout(questionStartTimer);clearTimeout(autoNextTimer)}
function startGame(){
 const n=+$("roundCount").value;
 buzzLimit=+$("buzzLimit").value;charSpeed=+$("charSpeed").value;
 if(answerMode==="choice")players=1;
 deck=buildDeck(n);idx=0;scores=[0,0,0];correctCount=0;wrongCount=0;
 $("home").classList.add("hide");$("result").classList.add("hide");$("game").classList.remove("hide");
 $("p2hud").classList.toggle("hide",answerMode==="choice"||players===1);
 $("buzzGrid").classList.toggle("hide",answerMode==="choice");
 $("buzz2").classList.toggle("hide",players===1);
 $("buzz1").classList.toggle("solo",players===1);
 $("p1name").textContent=answerMode==="choice"?"SCORE":(players===1?"YOU":"PLAYER 1");
 render();
}
function clearAnsweringPlayer(){
 const p1=$("p1hud"),p2=$("p2hud");
 if(p1)p1.classList.remove("answering","waiting");
 if(p2)p2.classList.remove("answering","waiting");
 if($("p1state"))$("p1state").textContent="";
 if($("p2state"))$("p2state").textContent="";
}
function setAnsweringPlayer(p){
 clearAnsweringPlayer();
 if(players===1){
  $("p1hud").classList.add("answering");
  $("p1state").textContent="回答中";
  return;
 }
 const me=p===1?$("p1hud"):$("p2hud");
 const other=p===1?$("p2hud"):$("p1hud");
 me.classList.add("answering");
 other.classList.add("waiting");
 (p===1?$("p1state"):$("p2state")).textContent="回答中";
}
function animateTitle(){
 const t=$("category");
 t.classList.remove("titleIn");
 void t.offsetWidth;
 t.classList.add("titleIn");
}
function feedback(kind){
 const card=$("gameCard"),status=$("status");
 card.classList.remove("feedbackCorrect","feedbackWrong");
 status.classList.remove("correctAction","wrongAction");
 void card.offsetWidth;
 if(kind==="correct"){card.classList.add("feedbackCorrect");status.classList.add("correctAction")}
 else{card.classList.add("feedbackWrong");status.classList.add("wrongAction")}
 setTimeout(()=>{card.classList.remove("feedbackCorrect","feedbackWrong");status.classList.remove("correctAction","wrongAction")},760);
}
function render(){
 clearTimers();clearAnsweringPlayer();locked=[];answered=false;revealPos=0;charIndex=0;currentChoices=[];
 const q=deck[idx];
 active=answerMode==="choice"?1:0;
 fullText=answerMode==="input"?(q.inputQ||q.q).replace(/。/g,"、").replace(/、+$/,""):q.q;
 $("round").textContent=`${idx+1} / ${deck.length}`;
 $("category").textContent=answerMode==="input"?(q.inputLabel||"答えを入力"):q.category;
 $("modeLabel").textContent=answerMode==="input"?"早押し":"学習";
 animateTitle();
 $("status").textContent="";
 $("choices").innerHTML="";$("choices").classList.add("hide");
 $("charBox").classList.add("hide");$("exp").classList.add("hide");$("next").classList.add("hide");
 $("buzz1").disabled=true;$("buzz2").disabled=true;$("fill").style.width="100%";
 $("phase").textContent="READY";
 $("question").textContent="";$("question").classList.remove("cursor","questionGo");$("question").classList.add("questionWait");
 updateScore();
 questionStartTimer=setTimeout(()=>{
  $("question").classList.remove("questionWait");$("question").classList.add("questionGo");
  $("phase").textContent=answerMode==="choice"?"学習中":"出題中";
  if(answerMode==="choice"){
   $("question").textContent=fullText;$("question").classList.remove("cursor");
   currentChoices=makeChoices(q);
   showChoices();
   startAnswerTimer(15,"選択");
  }else{
   $("buzz1").disabled=false;$("buzz2").disabled=false;$("status").textContent="早押し！";
   startReveal();
  }
 },1000);
}
function startReveal(){$("question").textContent="";$("question").classList.add("cursor");revealTimer=setInterval(()=>{revealPos++;$("question").textContent=fullText.slice(0,revealPos);if(revealPos>=fullText.length){clearInterval(revealTimer);$("question").classList.remove("cursor");startBuzzTimer()}},charSpeed)}
function resumeReveal(){if(revealPos>=fullText.length){startBuzzTimer();return}$("question").classList.add("cursor");revealTimer=setInterval(()=>{revealPos++;$("question").textContent=fullText.slice(0,revealPos);if(revealPos>=fullText.length){clearInterval(revealTimer);$("question").classList.remove("cursor");startBuzzTimer()}},charSpeed)}
function startBuzzTimer(){if(!buzzLimit)return;const st=Date.now();buzzTimer=setInterval(()=>{const left=Math.max(0,1-(Date.now()-st)/(buzzLimit*1000));$("fill").style.width=left*100+"%";if(left<=0){clearInterval(buzzTimer);timeout()}},80)}
function timeout(){if(answered||active)return;answered=true;$("status").textContent="時間切れ";$("question").textContent=fullText;$("question").classList.remove("cursor");showAnswer()}
function startAnswerTimer(seconds,label){
 clearInterval(answerTimer);
 let remain=seconds;
 $("status").textContent=`${label}（残り ${remain}秒）`;
 answerTimer=setInterval(()=>{
  remain--;
  if(remain<=0){
   clearInterval(answerTimer);
   $("status").textContent="回答時間切れ";
   wrong();
  }else{
   $("status").textContent=`${label}（残り ${remain}秒）`;
  }
 },1000)
}
function buzz(p){
 if(answerMode==="choice"||answered||active||locked.includes(p))return;
 clearTimers();active=p;setAnsweringPlayer(p);
 $("buzz1").disabled=true;$("buzz2").disabled=true;$("question").classList.remove("cursor");
 if(answerMode==="input"){startChars()}
 else{showChoices();startAnswerTimer(8,players===1?"YOU 回答中":`PLAYER ${p} 回答中`)}
}
function makeChoices(q){
 let pool=sh((q.pool||[]).filter(x=>norm(x)!==norm(q.answer)).slice());
 return sh([q.answer,...pool.slice(0,3)]);
}
function showChoices(){
 const q=deck[idx],b=$("choices");
 if(!currentChoices.length)currentChoices=makeChoices(q);
 b.innerHTML="";
 currentChoices.forEach(o=>{
  const x=document.createElement("button");
  x.className="choice";x.textContent=o;
  x.onclick=()=>{
   if(answered)return;
   clearInterval(answerTimer);
   if(norm(o)===norm(q.answer)){x.classList.add("ok");correct()}
   else{x.classList.add("ng");wrong()}
  };
  b.appendChild(x);
 });
 b.classList.remove("hide");
}
const H="あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽぁぃぅぇぉっゃゅょゎ";
const K="アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポァィゥェォッャュョヮー";
function cls(c){if(/[0-9]/.test(c))return"n";if(/[A-Za-z]/.test(c))return"a";if(/[ぁ-ん]/.test(c))return"h";return"k"}
function inventory(c){return cls(c)==="n"?[..."0123456789"]:cls(c)==="a"?[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"]:cls(c)==="h"?[...H]:[...K]}
function startChars(){targetChars=[...(deck[idx].charAnswer||"")];charIndex=0;$("charBox").classList.remove("hide");slots();charChoices();startAnswerTimer(4,players===1?"YOU：1文字を選択":`PLAYER ${active}：1文字を選択`)}
function slots(){const b=$("slots");b.innerHTML="";for(let i=0;i<charIndex;i++){const s=document.createElement("div");s.className="slot done";s.textContent=targetChars[i];b.appendChild(s)}if(charIndex<targetChars.length){const s=document.createElement("div");s.className="slot current";s.textContent="・";b.appendChild(s)}}
function charChoices(){const b=$("charChoices");b.innerHTML="";if(charIndex>=targetChars.length){clearInterval(answerTimer);correct();return}const c=targetChars[charIndex],pool=sh(inventory(c).filter(x=>x!==c));sh([c,...pool.slice(0,3)]).forEach(ch=>{const x=document.createElement("button");x.className="char";x.textContent=ch;x.onclick=()=>{if(ch===c){clearInterval(answerTimer);charIndex++;slots();if(charIndex>=targetChars.length){correct()}else{charChoices();startAnswerTimer(4,players===1?"YOU：1文字を選択":`PLAYER ${active}：1文字を選択`)}}else{clearInterval(answerTimer);x.classList.add("ng");[...document.querySelectorAll(".char")].forEach(z=>z.disabled=true);setTimeout(wrong,160)}};b.appendChild(x)})}
function correct(){if(answered)return;clearInterval(answerTimer);scores[active]+=10;correctCount++;answered=true;$("status").textContent="✓ 正解 +10";feedback("correct");updateScore();showAnswer()}
function wrong(){
 if(answered)return;
 clearInterval(answerTimer);
 if(answerMode==="choice"){
  scores[1]=Math.max(0,scores[1]-10);
  wrongCount++;answered=true;updateScore();
  $("status").textContent="✕ 不正解 -10";feedback("wrong");
  showAnswer();return;
 }
 scores[active]=Math.max(0,scores[active]-10);wrongCount++;locked.push(active);updateScore();
 $("status").textContent="✕ 不正解 -10";feedback("wrong");
 $("charBox").classList.add("hide");
 if(players===2&&locked.length<2){
  clearAnsweringPlayer();active=0;
  setTimeout(()=>{
   $("status").textContent="早押し！";
   $("buzz1").disabled=locked.includes(1);$("buzz2").disabled=locked.includes(2);
   resumeReveal();
  },620);
 }else{answered=true;showAnswer()}
}
function showAnswer(){
 clearTimers();clearAnsweringPlayer();
 const q=deck[idx];
 $("question").textContent=fullText;$("question").classList.remove("cursor");
 $("charBox").classList.add("hide");
 if(answerMode==="choice"){
  if($("choices").classList.contains("hide"))showChoices();
  [...document.querySelectorAll(".choice")].forEach(x=>{
   x.disabled=true;
   if(norm(x.textContent)===norm(q.answer))x.classList.add("ok");
  });
 }
 const explain=esc(q.explanation||`正解は「${q.answer}」。`);
 if(answerMode==="choice"){
  $("exp").innerHTML=`<div class="ans">正解：${esc(q.answer)}</div><div style="margin-top:7px;font-weight:900;color:var(--a)">解説</div><div class="expText" style="margin-top:4px">${explain}</div><div style="margin-top:8px;color:var(--m);font-size:11px">確認したら「次へ」を押してください</div>`;
 }else{
  $("exp").innerHTML=`<div class="ans">${esc(q.answer)}</div>${explain}<div style="margin-top:5px;color:var(--m);font-size:11px">3秒後に次の問題へ</div>`;
 }
 $("exp").classList.remove("hide");$("next").classList.remove("hide");
 $("buzz1").disabled=true;$("buzz2").disabled=true;
 if(answerMode==="input"){
  autoNextTimer=setTimeout(()=>{if(idx+1>=deck.length)finish();else{idx++;render()}},3000);
 }
}
function esc(s){return(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function nextQuestion(){clearTimeout(autoNextTimer);if(idx+1>=deck.length)finish();else{idx++;render()}}
function updateScore(){$("s1").textContent=scores[1];$("s2").textContent=scores[2]}
function finish(){clearTimers();$("game").classList.add("hide");$("result").classList.remove("hide");if(players===1){$("resultBody").innerHTML=`<div class="big">${scores[1]} pt</div><div class="stats">${correctCount} / ${deck.length}</div>`}else{$("resultTitle").textContent=scores[1]===scores[2]?"DRAW":`PLAYER ${scores[1]>scores[2]?1:2} WIN`;$("resultBody").innerHTML=`<div class="big">${scores[1]} - ${scores[2]}</div>`}}
function goHome(){clearTimers();$("result").classList.add("hide");$("game").classList.add("hide");$("home").classList.remove("hide")}
</script></body></html>
