<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>世界遺産 早押しバトル</title>
<style>
:root{
  --bg:#07111f; --panel:#0e1d31; --panel2:#132743; --text:#f5f7fb; --muted:#a9b7c9;
  --accent:#5eead4; --accent2:#60a5fa; --danger:#fb7185; --ok:#34d399; --gold:#fbbf24;
  --shadow:0 18px 50px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
radial-gradient(circle at 10% 5%,rgba(96,165,250,.16),transparent 32rem),
radial-gradient(circle at 95% 0%,rgba(94,234,212,.12),transparent 28rem),var(--bg);
color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
button{font:inherit}
.wrap{max-width:980px;margin:auto;padding:20px 16px 32px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.brand{font-weight:900;letter-spacing:.02em}.badge{font-size:12px;color:var(--accent);border:1px solid rgba(94,234,212,.35);border-radius:999px;padding:5px 9px}
.card{background:linear-gradient(180deg,rgba(19,39,67,.94),rgba(14,29,49,.96));border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow);border-radius:24px;padding:22px}
.hidden{display:none!important}
.hero{text-align:center;padding:32px 18px}
.hero h1{font-size:clamp(32px,7vw,58px);line-height:1.02;margin:8px 0 14px}
.hero p{color:var(--muted);line-height:1.7;margin:0 auto 24px;max-width:650px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:620px;margin:auto}
.primary,.secondary,.buzz,.choice,.smallbtn{border:0;border-radius:16px;cursor:pointer;transition:.12s transform,.12s opacity,.12s border-color}
.primary{padding:17px 20px;background:linear-gradient(135deg,var(--accent),#22d3ee);color:#06211e;font-weight:900}
.secondary{padding:17px 20px;background:#162c49;color:var(--text);font-weight:900;border:1px solid rgba(255,255,255,.1)}
button:active{transform:scale(.98)}
.note{margin-top:18px;color:#8292a7;font-size:12px}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin-bottom:12px}
.player,.roundbox{background:rgba(7,17,31,.55);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:12px 14px}
.player strong{font-size:20px}.player .score{font-size:28px;font-weight:900;margin-top:3px}.p2{text-align:right}
.roundbox{text-align:center;min-width:140px}.roundbox b{display:block;font-size:18px}.roundbox span{color:var(--muted);font-size:12px}
.timerbar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0 18px}.timerfill{height:100%;width:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .1s linear}
.qno{color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.question{font-weight:900;font-size:clamp(23px,4vw,38px);line-height:1.38;min-height:112px;display:flex;align-items:center;margin:8px 0 18px}
.buzzgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.buzz{min-height:120px;color:white;font-size:22px;font-weight:900;border:2px solid transparent}
.buzz1{background:linear-gradient(150deg,#1d4ed8,#2563eb)}.buzz2{background:linear-gradient(150deg,#be123c,#e11d48)}
.buzz.solo{grid-column:1/-1;background:linear-gradient(150deg,#0f766e,#14b8a6)}
.buzz:disabled{opacity:.35;cursor:not-allowed}
.keys{display:block;font-size:12px;font-weight:600;opacity:.8;margin-top:8px}
.status{text-align:center;color:var(--muted);min-height:28px;margin:12px 0 2px;font-weight:700}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.choice{padding:16px;text-align:left;background:#142b49;color:white;border:1px solid rgba(255,255,255,.09);font-weight:800;min-height:60px}
.choice:hover{border-color:rgba(94,234,212,.55)}.choice.correct{background:rgba(52,211,153,.18);border-color:var(--ok)}.choice.wrong{background:rgba(251,113,133,.16);border-color:var(--danger)}
.explain{margin-top:14px;padding:14px 16px;border-radius:15px;background:rgba(255,255,255,.05);color:#d7e0eb;line-height:1.6}
.nextrow{display:flex;gap:10px;justify-content:center;margin-top:14px}.smallbtn{padding:12px 18px;background:#203a5e;color:white;font-weight:800;border:1px solid rgba(255,255,255,.1)}
.result{text-align:center}.result h2{font-size:36px;margin:8px 0}.bigscore{font-size:64px;font-weight:950;color:var(--gold);margin:4px 0}.resultgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px auto;max-width:600px}.resultbox{padding:20px;background:rgba(255,255,255,.05);border-radius:18px}.winner{color:var(--accent);font-weight:900;font-size:20px}
.settings{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0 22px}
.selectwrap{background:#132743;border:1px solid rgba(255,255,255,.1);padding:9px 12px;border-radius:14px;color:var(--muted);font-size:13px}
select{background:transparent;color:white;border:0;font:inherit;outline:none}
.footer{text-align:center;color:#6f8198;font-size:11px;margin-top:18px;line-height:1.6}
@media(max-width:650px){
 .wrap{padding:12px 10px 24px}.card{padding:16px;border-radius:20px}.modes,.choices,.resultgrid{grid-template-columns:1fr}
 .hud{grid-template-columns:1fr 1fr}.roundbox{grid-column:1/-1;grid-row:1}.player{grid-row:2}.question{min-height:130px}
 .buzzgrid{gap:8px}.buzz{min-height:110px;font-size:20px}.hero{padding:22px 8px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">WORLD HERITAGE BUZZ</div><div class="badge">完全オフライン</div></div>

  <section id="home" class="card hero">
    <div class="qno">UNOFFICIAL PRACTICE</div>
    <h1>世界遺産<br>早押しバトル</h1>
    <p>世界遺産検定の基礎対策向け。1人で反射神経込みの練習、または1台のスマホ・PCを使って2人で早押し対戦できます。</p>
    <div class="settings">
      <label class="selectwrap">問題数
        <select id="roundCount">
          <option value="10">10問</option><option value="20" selected>20問</option><option value="30">30問</option><option value="50">50問</option>
        </select>
      </label>
      <label class="selectwrap">早押し時間
        <select id="timeLimit">
          <option value="5">5秒</option><option value="8" selected>8秒</option><option value="12">12秒</option><option value="0">無制限</option>
        </select>
      </label>
    </div>
    <div class="modes">
      <button class="primary" onclick="startGame(1)">1人で練習</button>
      <button class="secondary" onclick="startGame(2)">2人で対戦</button>
    </div>
    <div class="note">PC：1Pは A、2Pは L、1人モードは Space で早押し。スマホは画面のボタンをタップ。</div>
  </section>

  <section id="game" class="hidden">
    <div class="hud">
      <div class="player"><span id="p1name">PLAYER 1</span><div class="score" id="s1">0</div></div>
      <div class="roundbox"><b id="round">1 / 20</b><span id="phase">早押し受付中</span></div>
      <div class="player p2" id="p2hud"><span>PLAYER 2</span><div class="score" id="s2">0</div></div>
    </div>
    <div class="card">
      <div class="timerbar"><div id="timerFill" class="timerfill"></div></div>
      <div class="qno" id="category">WORLD HERITAGE</div>
      <div id="question" class="question"></div>
      <div id="buzzArea" class="buzzgrid">
        <button id="buzz1" class="buzz buzz1" onclick="buzz(1)">PLAYER 1<span class="keys">A キー</span></button>
        <button id="buzz2" class="buzz buzz2" onclick="buzz(2)">PLAYER 2<span class="keys">L キー</span></button>
      </div>
      <div id="status" class="status">早押し！</div>
      <div id="choices" class="choices hidden"></div>
      <div id="explain" class="explain hidden"></div>
      <div id="nextrow" class="nextrow hidden"><button class="smallbtn" onclick="nextQuestion()">次の問題</button><button class="smallbtn" onclick="quitGame()">終了</button></div>
    </div>
  </section>

  <section id="result" class="card result hidden">
    <div class="qno">RESULT</div>
    <h2 id="resultTitle">結果</h2>
    <div id="soloResult"></div>
    <div id="battleResult" class="resultgrid"></div>
    <div class="nextrow"><button class="primary" onclick="restart()">同じ設定でもう一度</button><button class="secondary" onclick="goHome()">設定に戻る</button></div>
  </section>

  <div class="footer">非公式の学習用クイズです。世界遺産検定・ユネスコの公式サイトではありません。<br>このHTMLだけで動作し、通信は行いません。</div>
</div>

<script>

let mode=1, deck=[], idx=0, maxRounds=20, scores=[0,0,0], activePlayer=0, locked=[], answered=false;
let timer=null, timeLimit=8, startedAt=0;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(m){
  mode=m; maxRounds=+document.getElementById('roundCount').value; timeLimit=+document.getElementById('timeLimit').value;
  deck=shuffle([...BANK]).slice(0,Math.min(maxRounds,BANK.length)); idx=0;scores=[0,0,0];
  document.getElementById('home').classList.add('hidden'); document.getElementById('result').classList.add('hidden'); document.getElementById('game').classList.remove('hidden');
  document.getElementById('p2hud').classList.toggle('hidden',mode===1);
  document.getElementById('buzz2').classList.toggle('hidden',mode===1);
  document.getElementById('buzz1').classList.toggle('solo',mode===1);
  document.getElementById('p1name').textContent=mode===1?'YOU':'PLAYER 1';
  renderQuestion();
}
function renderQuestion(){
  clearInterval(timer); activePlayer=0; locked=[]; answered=false;
  const q=deck[idx];
  document.getElementById('round').textContent=`${idx+1} / ${deck.length}`;
  document.getElementById('phase').textContent='早押し受付中';
  document.getElementById('question').textContent=q.q;
  document.getElementById('status').textContent='早押し！';
  document.getElementById('choices').innerHTML='';
  document.getElementById('choices').classList.add('hidden');
  document.getElementById('explain').classList.add('hidden');
  document.getElementById('nextrow').classList.add('hidden');
  document.getElementById('buzz1').disabled=false; document.getElementById('buzz2').disabled=false;
  updateScores();
  startTimer();
}
function startTimer(){
  const f=document.getElementById('timerFill'); f.style.width='100%'; startedAt=Date.now();
  if(timeLimit===0){ f.style.width='100%'; return; }
  timer=setInterval(()=>{
    const elapsed=(Date.now()-startedAt)/1000, left=Math.max(0,1-elapsed/timeLimit);
    f.style.width=(left*100)+'%';
    if(left<=0){clearInterval(timer); timeout();}
  },100);
}
function timeout(){
  if(answered || activePlayer) return;
  document.getElementById('status').textContent='時間切れ';
  document.getElementById('buzz1').disabled=true;document.getElementById('buzz2').disabled=true;
  revealNoBuzz();
}
function buzz(p){
  if(answered || activePlayer || locked.includes(p)) return;
  clearInterval(timer); activePlayer=p;
  document.getElementById('buzz1').disabled=true; document.getElementById('buzz2').disabled=true;
  document.getElementById('phase').textContent=(mode===1?'YOU':`PLAYER ${p}`)+' 回答中';
  document.getElementById('status').textContent=(mode===1?'あなた':`PLAYER ${p}`)+' が早押し！';
  showChoices();
}
function showChoices(){
  const q=deck[idx], box=document.getElementById('choices');box.innerHTML='';
  q.a.forEach((x,i)=>{
    const b=document.createElement('button'); b.className='choice';b.textContent=`${String.fromCharCode(65+i)}. ${x}`;b.onclick=()=>answer(i,b);box.appendChild(b);
  }); box.classList.remove('hidden');
}
function answer(choice,btn){
  if(answered || !activePlayer) return;
  const q=deck[idx], buttons=[...document.querySelectorAll('.choice')];
  if(choice===q.c){
    scores[activePlayer]+=10; answered=true;btn.classList.add('correct');
    buttons.forEach((b,i)=>{b.disabled=true;if(i===q.c)b.classList.add('correct')});
    document.getElementById('status').textContent=`正解！ +10点`;
    finishQuestion();
  }else{
    scores[activePlayer]-=5; btn.classList.add('wrong'); locked.push(activePlayer);
    buttons.forEach(b=>b.disabled=true);
    document.getElementById('status').textContent=`不正解… -5点`;
    if(mode===2 && locked.length<2){
      activePlayer=0;
      setTimeout(()=>{
        document.getElementById('choices').classList.add('hidden');
        document.getElementById('phase').textContent='相手に回答権';
        document.getElementById('status').textContent='もう一人が早押しできます';
        document.getElementById('buzz1').disabled=locked.includes(1);
        document.getElementById('buzz2').disabled=locked.includes(2);
        startedAt=Date.now(); startTimer();
      },650);
    }else{
      answered=true;
      setTimeout(()=>{buttons[q.c].classList.add('correct');finishQuestion();},450);
    }
  }
  updateScores();
}
function revealNoBuzz(){
  answered=true; const q=deck[idx]; showChoices();
  const buttons=[...document.querySelectorAll('.choice')];buttons.forEach((b,i)=>{b.disabled=true;if(i===q.c)b.classList.add('correct')});
  finishQuestion();
}
function finishQuestion(){
  clearInterval(timer); const q=deck[idx];
  document.getElementById('phase').textContent='解答';
  document.getElementById('explain').textContent=q.e;
  document.getElementById('explain').classList.remove('hidden');
  document.getElementById('nextrow').classList.remove('hidden');
  document.getElementById('buzz1').disabled=true;document.getElementById('buzz2').disabled=true;
}
function nextQuestion(){if(idx+1>=deck.length){showResult()}else{idx++;renderQuestion()}}
function updateScores(){document.getElementById('s1').textContent=scores[1];document.getElementById('s2').textContent=scores[2]}
function showResult(){

    solo.classList.add('hidden');battle.classList.remove('hidden');
    const t=scores[1]===scores[2]?'引き分け！':`PLAYER ${scores[1]>scores[2]?1:2} WIN!`;
    document.getElementById('resultTitle').textContent=t;
    battle.innerHTML=`<div class="resultbox"><div>PLAYER 1</div><div class="bigscore">${scores[1]}</div></div><div class="resultbox"><div>PLAYER 2</div><div class="bigscore">${scores[2]}</div></div>`;
  }
}
function restart(){startGame(mode)}
function quitGame(){showResult()}
function goHome(){clearInterval(timer);document.getElementById('result').classList.add('hidden');document.getElementById('game').classList.add('hidden');document.getElementById('home').classList.remove('hidden')}
document.addEventListener('keydown',e=>{
  if(document.getElementById('game').classList.contains('hidden')) return;
  if(mode===1 && e.code==='Space'){e.preventDefault();buzz(1)}
  if(mode===2 && e.key.toLowerCase()==='a')buzz(1);
  if(mode===2 && e.key.toLowerCase()==='l')buzz(2);
  if(!document.getElementById('choices').classList.contains('hidden') && activePlayer && !answered){
    const n=['1','2','3','4'].indexOf(e.key); if(n>=0){const b=document.querySelectorAll('.choice')[n];if(b&&!b.disabled)answer(n,b)}
  }
  if(answered && e.key==='Enter')nextQuestion();
});
</script>
</body></html>
