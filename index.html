<html lang="ja"><head>

<style>
:root{--bg:#07111f;--p:#0d1d31;--p2:#132743;--t:#f7f9fc;--m:#8fa2b9;--a:#5eead4;--b:#60a5fa;--r:#fb7185;--g:#34d399;--gold:#fbbf24}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 8% 0,#0d3855 0,transparent 27rem),radial-gradient(circle at 100% 0,#0a4846 0,transparent 23rem),var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}button,select{font:inherit}.w{max-width:880px;margin:auto;padding:9px}.top{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 4px}.brand{font-size:12px;font-weight:950;letter-spacing:.05em}.tag{font-size:10px;color:var(--a);border:1px solid #5eead455;border-radius:99px;padding:3px 8px}.card{background:linear-gradient(180deg,#132743f5,#0d1d31fa);border:1px solid #ffffff13;border-radius:20px;padding:14px;box-shadow:0 15px 50px #0005}.hide{display:none!important}

.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;margin-bottom:7px}.box{background:#09192b;border:1px solid #ffffff12;border-radius:14px;padding:8px 10px}.p2{text-align:right}.score{font-size:24px;font-weight:950}.mid{text-align:center;min-width:120px;font-size:12px}.mid small{color:var(--m)}.bar{height:6px;background:#ffffff12;border-radius:99px;overflow:hidden;margin-bottom:10px}.fill{height:100%;background:linear-gradient(90deg,var(--b),var(--a));width:100%}.meta{display:flex;justify-content:space-between;align-items:flex-end;color:var(--a);font-weight:900}.meta #category{font-size:clamp(20px,5vw,28px);font-weight:950;line-height:1.1}.meta #modeLabel{font-size:10px;color:var(--m)}.q{font-size:clamp(23px,4.8vw,36px);font-weight:950;line-height:1.5;min-height:145px;display:flex;align-items:center;margin:4px 0 10px;white-space:pre-wrap}.cursor:after{content:"▋";color:var(--a);animation:bl .8s infinite}@keyframes bl{50%{opacity:.15}}

<div class="top"><div class="brand">WORLD HERITAGE BUZZ</div><div class="tag">QUIZ</div></div>
<section id="home" class="card home">
<h1>世界遺産早押し</h1>
<div class="settings">
<label class="set">問題数<select id="roundCount"><option>10</option><option selected>20</option><option>30</option><option>50</option><option>100</option></select></label>

</div>
<div class="label">回答モード</div><div class="modes"><button id="modeInput" class="pick active" onclick="selectAnswerMode('input')">記述</button><button id="modeChoice" class="pick" onclick="selectAnswerMode('choice')">4択</button></div>

<button class="start" onclick="startGame()">START</button>
</section>
<section id="game" class="hide">

<div class="card"><div class="bar"><div id="fill" class="fill"></div></div><div class="meta"><span id="category"></span><span id="modeLabel"></span></div><div id="question" class="q cursor"></div>
<div class="buzzgrid"><button id="buzz1" class="buzz b1" onclick="buzz(1)">PLAYER 1</button><button id="buzz2" class="buzz b2" onclick="buzz(2)">PLAYER 2</button></div><div id="status" class="status">早押し！</div>
<div id="choices" class="choices hide"></div><div id="charBox" class="charbox hide"><div id="slots" class="slots"></div><div id="charChoices" class="chars"></div></div>
<div id="exp" class="exp hide"></div><div id="next" class="next hide"><button class="small" onclick="nextQuestion()">次へ</button><button class="small" onclick="finish()">終了</button></div></div>
</section>
<section id="result" class="card result hide"><h2 id="resultTitle">RESULT</h2><div id="resultBody"></div><div class="next"><button class="start" onclick="startGame()">もう一度</button><button class="small" onclick="goHome()">戻る</button></div></section>

function sh(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function selectAnswerMode(m){answerMode=m;$("modeInput").classList.toggle("active",m==="input");$("modeChoice").classList.toggle("active",m==="choice")}
function selectPlayers(n){players=n;$("oneP").classList.toggle("active",n===1);$("twoP").classList.toggle("active",n===2)}
function norm(s){return(s||"").normalize("NFKC").toLowerCase().replace(/[・･·,，、。．.\s'"「」『』（）()\[\]【】＝=／/:：―-]/g,"")}
function buildDeck(n){const p=BANK.filter(q=>(q.modes||[]).includes(answerMode));return sh(p.slice()).slice(0,Math.min(n,p.length))}
function clearTimers(){clearInterval(revealTimer);clearInterval(buzzTimer);clearTimeout(autoNextTimer)}
function startGame(){const n=+$("roundCount").value;buzzLimit=+$("buzzLimit").value;charSpeed=+$("charSpeed").value;deck=buildDeck(n);idx=0;scores=[0,0,0];correctCount=0;wrongCount=0;$("home").classList.add("hide");$("result").classList.add("hide");$("game").classList.remove("hide");$("p2hud").classList.toggle("hide",players===1);$("buzz2").classList.toggle("hide",players===1);$("buzz1").classList.toggle("solo",players===1);$("p1name").textContent=players===1?"YOU":"PLAYER 1";render()}
function render(){clearTimers();active=0;locked=[];answered=false;revealPos=0;charIndex=0;const q=deck[idx];fullText=answerMode==="input"?(q.inputQ||q.q).replace(/。/g,"、").replace(/、+$/,""):q.q;$("round").textContent=`${idx+1} / ${deck.length}`;$("category").textContent=answerMode==="input"?(q.inputLabel||"答えを入力"):q.category;$("modeLabel").textContent=answerMode==="input"?"記述":"4択";$("status").textContent="早押し！";$("choices").innerHTML="";$("choices").classList.add("hide");$("charBox").classList.add("hide");$("exp").classList.add("hide");$("next").classList.add("hide");$("buzz1").disabled=false;$("buzz2").disabled=false;$("fill").style.width="100%";$("phase").textContent="出題中";updateScore();if(answerMode==="input")startReveal();else{$("question").textContent=fullText;$("question").classList.remove("cursor");startBuzzTimer()}}
function startReveal(){$("question").textContent="";$("question").classList.add("cursor");revealTimer=setInterval(()=>{revealPos++;$("question").textContent=fullText.slice(0,revealPos);if(revealPos>=fullText.length){clearInterval(revealTimer);$("question").classList.remove("cursor");startBuzzTimer()}},charSpeed)}
function resumeReveal(){if(revealPos>=fullText.length){startBuzzTimer();return}$("question").classList.add("cursor");revealTimer=setInterval(()=>{revealPos++;$("question").textContent=fullText.slice(0,revealPos);if(revealPos>=fullText.length){clearInterval(revealTimer);$("question").classList.remove("cursor");startBuzzTimer()}},charSpeed)}
function startBuzzTimer(){if(!buzzLimit)return;const st=Date.now();buzzTimer=setInterval(()=>{const left=Math.max(0,1-(Date.now()-st)/(buzzLimit*1000));$("fill").style.width=left*100+"%";if(left<=0){clearInterval(buzzTimer);timeout()}},80)}
function timeout(){if(answered||active)return;answered=true;$("status").textContent="時間切れ";$("question").textContent=fullText;$("question").classList.remove("cursor");showAnswer()}
function buzz(p){if(answered||active||locked.includes(p))return;clearTimers();active=p;$("buzz1").disabled=true;$("buzz2").disabled=true;$("question").classList.remove("cursor");$("status").textContent="回答中";if(answerMode==="input")startChars();else showChoices()}
function makeChoices(q){let pool=sh((q.pool||[]).filter(x=>norm(x)!==norm(q.answer)).slice());return sh([q.answer,...pool.slice(0,3)])}
function showChoices(){const q=deck[idx],b=$("choices");b.innerHTML="";makeChoices(q).forEach(o=>{const x=document.createElement("button");x.className="choice";x.textContent=o;x.onclick=()=>{if(norm(o)===norm(q.answer)){x.classList.add("ok");correct()}else{x.classList.add("ng");wrong()}};b.appendChild(x)});b.classList.remove("hide")}
const H="あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽぁぃぅぇぉっゃゅょゎ";
const K="アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポァィゥェォッャュョヮー";
function cls(c){if(/[0-9]/.test(c))return"n";if(/[A-Za-z]/.test(c))return"a";if(/[ぁ-ん]/.test(c))return"h";return"k"}
function inventory(c){return cls(c)==="n"?[..."0123456789"]:cls(c)==="a"?[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"]:cls(c)==="h"?[...H]:[...K]}
function startChars(){targetChars=[...(deck[idx].charAnswer||"")];charIndex=0;$("charBox").classList.remove("hide");slots();charChoices()}
function slots(){const b=$("slots");b.innerHTML="";for(let i=0;i<charIndex;i++){const s=document.createElement("div");s.className="slot done";s.textContent=targetChars[i];b.appendChild(s)}if(charIndex<targetChars.length){const s=document.createElement("div");s.className="slot current";s.textContent="・";b.appendChild(s)}}
function charChoices(){const b=$("charChoices");b.innerHTML="";if(charIndex>=targetChars.length){correct();return}const c=targetChars[charIndex],pool=sh(inventory(c).filter(x=>x!==c));sh([c,...pool.slice(0,3)]).forEach(ch=>{const x=document.createElement("button");x.className="char";x.textContent=ch;x.onclick=()=>{if(ch===c){charIndex++;slots();charChoices()}else{x.classList.add("ng");[...document.querySelectorAll(".char")].forEach(z=>z.disabled=true);setTimeout(wrong,160)}};b.appendChild(x)})}
function correct(){if(answered)return;scores[active]+=10;correctCount++;answered=true;$("status").textContent="正解 +10";updateScore();showAnswer()}
function wrong(){if(answered)return;scores[active]-=10;wrongCount++;locked.push(active);updateScore();$("status").textContent="不正解 -10";$("charBox").classList.add("hide");$("choices").classList.add("hide");if(players===2&&locked.length<2){active=0;setTimeout(()=>{$("status").textContent="早押し！";$("buzz1").disabled=locked.includes(1);$("buzz2").disabled=locked.includes(2);if(answerMode==="input")resumeReveal();else startBuzzTimer()},420)}else{answered=true;showAnswer()}}
function showAnswer(){clearTimers();const q=deck[idx];$("question").textContent=fullText;$("question").classList.remove("cursor");$("charBox").classList.add("hide");if(answerMode==="choice"){if($("choices").classList.contains("hide"))showChoices();[...document.querySelectorAll(".choice")].forEach(x=>{x.disabled=true;if(norm(x.textContent)===norm(q.answer))x.classList.add("ok")})}$("exp").innerHTML=`<div class="ans">${esc(q.answer)}</div>${esc(q.explanation||"")}<div style="margin-top:5px;color:var(--m);font-size:11px">3秒後に次の問題へ</div>`;$("exp").classList.remove("hide");$("next").classList.remove("hide");$("buzz1").disabled=true;$("buzz2").disabled=true;autoNextTimer=setTimeout(()=>{if(idx+1>=deck.length)finish();else{idx++;render()}},3000)}
function esc(s){return(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function nextQuestion(){clearTimeout(autoNextTimer);if(idx+1>=deck.length)finish();else{idx++;render()}}
function updateScore(){$("s1").textContent=scores[1];$("s2").textContent=scores[2]}
function finish(){clearTimers();$("game").classList.add("hide");$("result").classList.remove("hide");if(players===1){$("resultBody").innerHTML=`<div class="big">${scores[1]} pt</div><div class="stats">${correctCount} / ${deck.length}</div>`}else{$("resultTitle").textContent=scores[1]===scores[2]?"DRAW":`PLAYER ${scores[1]>scores[2]?1:2} WIN`;$("resultBody").innerHTML=`<div class="big">${scores[1]} - ${scores[2]}</div>`}}
function goHome(){clearTimers();$("result").classList.add("hide");$("game").classList.add("hide");$("home").classList.remove("hide")}
</script></body></html>
