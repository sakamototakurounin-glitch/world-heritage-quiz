<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>VocabStar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--text:#111827;--sub:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accentSoft:#eff6ff;--danger:#dc2626;--star:#f59e0b}
    *{box-sizing:border-box}
    html,body{max-width:100%;overflow-x:hidden}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
    button,input,textarea,select{font:inherit;max-width:100%}
    button{touch-action:manipulation}
    .app{width:100%;max-width:1080px;margin:auto;padding:14px}
    .top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .brand{font-size:24px;font-weight:850}
    .muted{color:var(--sub);font-size:12px}
    .grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px;margin-top:12px}
    .card{min-width:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:0 2px 10px rgba(0,0,0,.035)}
    .row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;min-width:0}
    .grow{flex:1;min-width:0}
    .btn{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:10px;cursor:pointer;white-space:nowrap}
    .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn.danger{color:var(--danger)}
    .btn.small{padding:5px 7px;font-size:12px}
    .iconbtn{border:0;background:transparent;border-radius:8px;padding:5px 7px;cursor:pointer;color:var(--sub)}
    .iconbtn:hover{background:#f3f4f6}
    .input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}
    .sectionTitle{font-weight:800;margin:0 0 7px}
    .fileSelectRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px}
    #fileSelect{font-weight:700}
    .subhead{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
    .listScroller{display:flex;flex-direction:column;gap:7px;margin-top:7px}
    .listBtn{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 9px;cursor:pointer}
    .listBtn.active{border-color:var(--accent);background:var(--accentSoft)}
    .listTitle{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .listMeta{font-size:11px;color:var(--sub);margin-top:2px}
    .autoViews{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
    .autoBtn{border:1px solid #fde68a;background:#fffbeb;border-radius:10px;padding:8px 7px;text-align:left;cursor:pointer}
    .autoBtn.active{box-shadow:0 0 0 1px var(--star) inset}
    .autoBtn b{color:#a16207}
    .help{font-size:11px;color:var(--sub);line-height:1.55;margin-top:8px}
    .stickyActions{display:flex;gap:7px;flex-wrap:wrap}
    .toolbar{display:flex;gap:7px;margin:9px 0}
    .stats{display:flex;gap:6px;flex-wrap:wrap}
    .pill{font-size:11px;padding:5px 8px;background:#f3f4f6;border-radius:999px}
    .modeBadge{display:inline-flex;font-size:11px;padding:4px 7px;border-radius:999px;background:#fffbeb;border:1px solid #fde68a;color:#92400e}
    .hidden{display:none!important}
    .tableWrap{width:100%;overflow:auto;margin-top:8px}
    table{width:100%;border-collapse:collapse;min-width:650px}
    th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    .word{font-weight:800;overflow-wrap:anywhere}
    .jp{color:#374151;overflow-wrap:anywhere}
    .example{font-size:12px;color:var(--sub);max-width:330px;overflow-wrap:anywhere}
    .wordHead{display:flex;align-items:center;gap:4px}
    .audioBtn{border:0;background:#f3f4f6;border-radius:999px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
    .audioBtn:active{transform:scale(.96)}
    .stars{white-space:nowrap}
    .stars button{border:0;background:transparent;font-size:20px;padding:0 1px;cursor:pointer}
    .star-on{color:var(--star)}.star-off{color:#d1d5db}
    .empty{padding:26px;text-align:center;color:var(--sub)}
    dialog{border:0;border-radius:16px;padding:0;width:calc(100% - 20px);max-width:720px}
    dialog::backdrop{background:rgba(0,0,0,.38)}
    .modal{padding:15px;max-height:90dvh;overflow:auto}
    .modal h2{margin:0 0 10px}
    .flashCard{height:320px;perspective:1000px;cursor:pointer;user-select:none;margin-top:10px}
    .flashInner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .35s}
    .flashCard.flipped .flashInner{transform:rotateY(180deg)}
    .flashFace{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:20px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.07)}
    .flashBack{transform:rotateY(180deg)}
    .flashWord{font-size:34px;font-weight:850;overflow-wrap:anywhere}
    .flashJp{font-size:25px;font-weight:750;line-height:1.4}
    .flashEx{font-size:14px;color:var(--sub);line-height:1.55;margin-top:15px}
    .flashHint{position:absolute;bottom:14px;font-size:11px;color:var(--sub)}
    .flashAudio{position:absolute;top:14px;right:14px;width:42px;height:42px;font-size:20px}
    .flashControls{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;margin-top:10px}
    .flashProgress{text-align:center;color:var(--sub);font-size:12px}
    .flashStarbar{display:flex;justify-content:center;gap:5px;margin-top:8px}
    .flashStarbar button{font-size:27px;border:0;background:transparent;cursor:pointer}
    .autoSpeakRow{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
    .switchRow{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub)}
    .sentence{font-size:22px;line-height:1.5;margin:18px 0;text-align:center}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .choice{padding:12px;border:1px solid var(--line);background:#fff;border-radius:11px;text-align:left;cursor:pointer}
    .choice.correct{border-color:#16a34a;background:#f0fdf4}
    .choice.wrong{border-color:#dc2626;background:#fef2f2}

    @media(max-width:800px){
      body{background:#fff}
      .app{padding:9px 8px calc(16px + env(safe-area-inset-bottom))}
      .top{gap:6px}
      .brand{font-size:22px}
      .top .muted{display:none}
      .top>.row{margin-left:auto;flex-wrap:nowrap}
      .top .btn{padding:6px 8px;font-size:12px}
      .grid{display:block;margin-top:7px}
      aside.card{padding:9px;margin-bottom:9px}
      main.card{padding:9px}
      .help{display:none}
      .listScroller{flex-direction:row;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:4px}
      .listScroller::-webkit-scrollbar{display:none}
      .listBtn{min-width:130px;max-width:180px;flex:0 0 auto}
      .autoViews{margin-top:6px}
      #deckTitle{font-size:20px!important}
      .stickyActions{width:100%;display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:4px}
      .stickyActions .btn{width:100%;padding:9px 4px;font-size:12px}
      #searchInput{font-size:16px}
      .tableWrap{overflow:visible}
      table{display:block;min-width:0;width:100%}
      thead{display:none}
      tbody{display:block}
      tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 7px;border:1px solid var(--line);border-radius:12px;padding:9px;margin-bottom:7px}
      td{display:block;border:0;padding:0;min-width:0}
      td:nth-child(1){grid-column:1;grid-row:1}
      td:nth-child(2){grid-column:1;grid-row:2;font-size:14px}
      td:nth-child(3){grid-column:1/-1;grid-row:3;border-top:1px dashed var(--line);padding-top:5px;margin-top:3px}
      td:nth-child(4){grid-column:2;grid-row:1/3;align-self:center}
      td:nth-child(5){grid-column:2;grid-row:3;justify-self:end;align-self:end}
      .word{font-size:17px}
      .example{max-width:none}
      .audioBtn{width:28px;height:28px}
      .choices{grid-template-columns:1fr}
      .sentence{font-size:19px}
      .flashCard{height:300px}
      .flashWord{font-size:31px}
      .flashJp{font-size:22px}
      input,textarea,select{font-size:16px}
    }
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="brand">VocabStar</div><div class="muted">英単語特化・オフライン単語帳</div></div>
    <div class="row"><button class="btn" id="exportBtn">バックアップ</button><button class="btn" id="restoreBtn">復元</button></div>
  </div>

  <div class="grid">
    <aside class="card">
      <div class="sectionTitle">ファイル</div>
      <div class="fileSelectRow">
        <select id="fileSelect"></select>
        <button class="btn small primary" id="addFileBtn">＋</button>
      </div>
      <div class="row" style="justify-content:flex-end;margin-top:5px">
        <button class="iconbtn" id="renameFileBtn">名前変更</button>
        <button class="iconbtn" id="deleteFileBtn">削除</button>
      </div>

      <div class="subhead">
        <b>単語帳リスト</b>
        <button class="btn small" id="addListBtn">＋単語帳</button>
      </div>
      <div class="listScroller" id="listScroller"></div>

      <div class="autoViews">
        <button class="autoBtn" id="fileStar1Btn"><b>★1 統合</b><div class="listMeta" id="star1Count"></div></button>
        <button class="autoBtn" id="fileStar2Btn"><b>★★ 統合</b><div class="listMeta" id="star2Count"></div></button>
      </div>
      <div class="help">★1/★★は、現在のファイル内にあるすべての単語帳から自動でまとめられます。</div>
    </aside>

    <main class="card">
      <div class="row">
        <div class="grow">
          <div class="row">
            <h2 id="deckTitle" style="margin:0">単語帳</h2>
            <span class="modeBadge hidden" id="modeBadge"></span>
          </div>
          <div class="muted" id="deckMeta"></div>
        </div>
        <div class="stickyActions">
          <button class="btn" id="importBtn">インポート</button>
          <button class="btn" id="flashBtn">カード</button>
          <button class="btn primary" id="testBtn">4択</button>
        </div>
      </div>
      <div class="toolbar"><input class="input grow" id="searchInput" placeholder="英単語 / 日本語で検索"></div>
      <div class="stats" id="stats"></div>
      <div class="tableWrap">
        <table>
          <thead><tr><th>英単語</th><th>日本語</th><th>例文</th><th>重要度</th><th></th></tr></thead>
          <tbody id="wordBody"></tbody>
        </table>
      </div>
      <div class="empty hidden" id="emptyState">この表示に該当する単語がありません。</div>
    </main>
  </div>
</div>

<dialog id="nameDialog"><div class="modal">
  <h2 id="nameDialogTitle"></h2>
  <input class="input" id="nameInput">
  <div class="row" style="justify-content:flex-end;margin-top:10px">
    <button class="btn" data-close="nameDialog">キャンセル</button>
    <button class="btn primary" id="nameSaveBtn">保存</button>
  </div>
</div></dialog>

<dialog id="importDialog"><div class="modal">
  <h2>一括インポート</h2>
  <div class="help" style="display:block">1行1語：<b>英単語[TAB]日本語[TAB]例文（任意）</b><br>カンマ区切りにも対応します。</div>
  <textarea id="importText" rows="12" placeholder="reluctant&#9;気が進まない&#9;He was reluctant to accept the offer."></textarea>
  <div class="row" style="justify-content:flex-end;margin-top:10px">
    <button class="btn" data-close="importDialog">キャンセル</button>
    <button class="btn primary" id="doImportBtn">インポート</button>
  </div>
</div></dialog>

<dialog id="flashDialog"><div class="modal">
  <div class="row"><h2 style="margin:0" class="grow">フラッシュカード</h2><button class="btn" data-close="flashDialog">終了</button></div>
  <div class="autoSpeakRow">
    <div class="muted" id="flashScopeName"></div>
    <label class="switchRow"><input type="checkbox" id="autoSpeak">自動発音</label>
  </div>
  <div class="empty hidden" id="flashEmpty">対象の単語がありません。</div>
  <div id="flashArea">
    <div class="flashCard" id="flashCard">
      <div class="flashInner">
        <div class="flashFace">
          <button class="audioBtn flashAudio" id="flashAudioBtn" type="button">🔊</button>
          <div class="flashWord" id="flashWord"></div>
          <div class="flashHint">タップして意味を見る</div>
        </div>
        <div class="flashFace flashBack">
          <div class="flashJp" id="flashJp"></div>
          <div class="flashEx" id="flashEx"></div>
          <div class="flashHint">タップして英単語に戻る</div>
        </div>
      </div>
    </div>
    <div class="flashStarbar"><button id="flashStar1">★</button><button id="flashStar2">★</button></div>
    <div class="flashControls">
      <button class="btn" id="prevFlashBtn">← 前</button>
      <div class="flashProgress" id="flashProgress"></div>
      <button class="btn primary" id="nextFlashBtn">次 →</button>
    </div>
    <div class="row" style="justify-content:center;margin-top:8px"><button class="btn small" id="shuffleFlashBtn">シャッフル</button></div>
  </div>
</div></dialog>

<dialog id="testDialog"><div class="modal">
  <div class="row"><h2 style="margin:0" class="grow">英文4択テスト</h2><button class="btn" data-close="testDialog">終了</button></div>
  <div class="row" style="margin-top:10px"><button class="btn primary" id="startTestBtn">テスト開始</button></div>
  <div class="empty" id="testEmpty">現在表示中の単語から出題します。</div>
  <div class="hidden" id="testBox">
    <div class="muted" id="testProgress" style="text-align:center;margin-top:10px"></div>
    <div class="sentence" id="sentence"></div>
    <div class="choices" id="choices"></div>
    <div id="feedback" style="margin-top:12px;font-weight:700;text-align:center"></div>
    <div class="row" style="justify-content:center"><button class="btn primary hidden" id="nextQBtn" style="margin-top:12px">次の問題</button></div>
  </div>
</div></dialog>

<dialog id="restoreDialog"><div class="modal">
  <h2>バックアップから復元</h2>
  <textarea id="restoreText" rows="10" placeholder="バックアップJSONを貼り付け"></textarea>
  <div class="row" style="justify-content:flex-end;margin-top:10px">
    <button class="btn" data-close="restoreDialog">キャンセル</button>
    <button class="btn primary" id="doRestoreBtn">復元</button>
  </div>
</div></dialog>

<script>
const KEY='vocabstar_v3';
const LEGACY_KEY='vocabstar_v1';

let state=loadState();
let activeFileId=state.files[0].id;
let activeListId=state.files[0].lists[0].id;
let viewMode='list'; // list | star1 | star2
let nameAction=null;
let flashState={items:[],index:0};
let testState=null;

function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function makeList(name,words=[]){return {id:uid(),name,words:words.map(w=>({...w,id:w.id||uid(),star:Number(w.star)||0}))}}
function makeFile(name,lists=[]){return {id:uid(),name,lists:lists.length?lists:[makeList('My Words')]}}
function loadState(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    if(x&&Array.isArray(x.files)&&x.files.length)return x
  }catch(e){}
  try{
    const old=JSON.parse(localStorage.getItem(LEGACY_KEY));
    if(old&&Array.isArray(old.decks)&&old.decks.length){
      const migrated={files:[makeFile('My File',old.decks.map(d=>makeList(d.name||'単語帳',d.words||[])))]};
      localStorage.setItem(KEY,JSON.stringify(migrated));
      return migrated
    }
  }catch(e){}
  return {files:[makeFile('My File')]}
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function currentFile(){return state.files.find(f=>f.id===activeFileId)}
function currentList(){return currentFile()?.lists.find(l=>l.id===activeListId)}
function fileWords(file=currentFile()){return file?file.lists.flatMap(l=>l.words.map(w=>({...w,listId:l.id,listName:l.name}))):[]}
function wordsForView(){
  if(viewMode==='star1')return fileWords().filter(w=>w.star===1);
  if(viewMode==='star2')return fileWords().filter(w=>w.star===2);
  return (currentList()?.words||[]).map(w=>({...w,listId:activeListId,listName:currentList()?.name||''}))
}
function filteredWords(){
  let a=wordsForView();
  const q=searchInput.value.trim().toLowerCase();
  if(q)a=a.filter(w=>(w.en+' '+w.jp+' '+(w.example||'')).toLowerCase().includes(q));
  return a
}
function findStoredWord(id,listId){
  return currentFile()?.lists.find(l=>l.id===listId)?.words.find(w=>w.id===id)
}
function render(){
  fileSelect.innerHTML='';
  state.files.forEach(f=>{
    const o=document.createElement('option');o.value=f.id;o.textContent=f.name;if(f.id===activeFileId)o.selected=true;fileSelect.appendChild(o)
  });
  const f=currentFile();
  listScroller.innerHTML='';
  f.lists.forEach(l=>{
    const b=document.createElement('button');b.className='listBtn '+(viewMode==='list'&&l.id===activeListId?'active':'');
    b.innerHTML=`<div class="listTitle">${esc(l.name)}</div><div class="listMeta">${l.words.length}語</div>`;
    b.onclick=()=>{activeListId=l.id;viewMode='list';searchInput.value='';render()};
    b.oncontextmenu=e=>{e.preventDefault();openListMenu(l.id)};
    listScroller.appendChild(b)
  });
  const fw=fileWords(f);
  const c1=fw.filter(w=>w.star===1).length,c2=fw.filter(w=>w.star===2).length;
  star1Count.textContent=`${c1}語`;star2Count.textContent=`${c2}語`;
  fileStar1Btn.classList.toggle('active',viewMode==='star1');
  fileStar2Btn.classList.toggle('active',viewMode==='star2');

  let title='',meta='';
  if(viewMode==='list'){title=currentList()?.name||'単語帳';meta=`${f.name} / ${currentList()?.words.length||0}語`;modeBadge.classList.add('hidden')}
  else{title=f.name;meta=`ファイル内の全単語帳から自動統合`;modeBadge.textContent=viewMode==='star1'?'★1 統合':'★★ 統合';modeBadge.classList.remove('hidden')}
  deckTitle.textContent=title;deckMeta.textContent=meta;

  const raw=wordsForView();
  stats.innerHTML=`<span class="pill">表示 ${raw.length}</span><span class="pill">ファイル全体 ${fw.length}</span><span class="pill">★1 ${c1}</span><span class="pill">★★ ${c2}</span>`;
  importBtn.disabled=viewMode!=='list';

  const words=filteredWords();wordBody.innerHTML='';
  words.forEach(w=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><div class="wordHead"><button class="audioBtn" type="button">🔊</button><div><div class="word">${esc(w.en)}</div>${viewMode!=='list'?`<div class="listMeta">${esc(w.listName)}</div>`:''}</div></div></td><td class="jp">${esc(w.jp)}</td><td class="example">${esc(w.example||'')}</td><td class="stars"></td><td><button class="btn small danger">削除</button></td>`;
    tr.children[0].querySelector('.audioBtn').onclick=e=>{e.stopPropagation();speak(w.en)};
    const stars=tr.children[3];
    [1,2].forEach(n=>{
      const sb=document.createElement('button');sb.textContent='★';sb.className=w.star>=n?'star-on':'star-off';
      sb.onclick=()=>setStar(w.id,w.listId,n);stars.appendChild(sb)
    });
    tr.children[4].querySelector('button').onclick=()=>deleteWord(w.id,w.listId);
    wordBody.appendChild(tr)
  });
  emptyState.classList.toggle('hidden',words.length>0)
}
function setStar(id,listId,n){
  const w=findStoredWord(id,listId);if(!w)return;
  w.star=(w.star===n?0:n);save();
  if(flashDialog.open)refreshFlash(id,listId)
}
function deleteWord(id,listId){
  const l=currentFile()?.lists.find(x=>x.id===listId);if(!l)return;
  const i=l.words.findIndex(w=>w.id===id);if(i>=0)l.words.splice(i,1);save()
}
function parseImport(text){
  return text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(line=>{
    let p=line.split('\t');if(p.length<2)p=line.split(',');
    return {en:(p[0]||'').trim(),jp:(p[1]||'').trim(),example:p.slice(2).join(',').trim()}
  }).filter(x=>x.en&&x.jp)
}
function speak(text){
  if(!('speechSynthesis' in window)){alert('この端末では音声読み上げを利用できません。');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=.88;u.pitch=1;
  const voices=speechSynthesis.getVoices();
  const preferred=voices.find(v=>/^en-(US|GB)/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));
  if(preferred)u.voice=preferred;
  speechSynthesis.speak(u)
}
function openName(title,value,action){nameDialogTitle.textContent=title;nameInput.value=value||'';nameAction=action;nameDialog.showModal();setTimeout(()=>nameInput.focus(),50)}
function ensureActive(){
  const f=currentFile()||state.files[0];activeFileId=f.id;
  if(!f.lists.some(l=>l.id===activeListId))activeListId=f.lists[0].id
}
function inferType(w){
  const jp=w.jp||'',en=w.en.toLowerCase();
  if(/ly$/.test(en))return'adv';
  if(/する|させる|になる|める|む|ぶ|く$/.test(jp))return'verb';
  if(/な$|い$|的$/.test(jp)||/(ous|ful|less|able|ible|ive|al|ic|ent|ant)$/.test(en))return'adj';
  return'noun'
}
function makeSentence(w){
  if(w.example){
    const escaped=w.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),re=new RegExp(`\\b${escaped}\\b`,'i');
    if(re.test(w.example))return w.example.replace(re,'____')
  }
  const p={
    verb:['They decided to ____ the plan before the deadline.','We need to ____ the issue carefully.'],
    adj:['The situation was surprisingly ____ for everyone involved.','The result seemed ____ at first.'],
    adv:['She responded ____ to the question.','The team worked ____ throughout the project.'],
    noun:['The manager mentioned the ____ during the meeting.','They discussed the ____ in class yesterday.']
  }[inferType(w)];
  return p[Math.floor(Math.random()*p.length)]
}
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}

/* file/list actions */
fileSelect.onchange=()=>{activeFileId=fileSelect.value;activeListId=currentFile().lists[0].id;viewMode='list';searchInput.value='';render()};
addFileBtn.onclick=()=>openName('ファイルを作成','',name=>{const f=makeFile(name);state.files.push(f);activeFileId=f.id;activeListId=f.lists[0].id;viewMode='list';save()});
renameFileBtn.onclick=()=>openName('ファイル名を変更',currentFile().name,name=>{currentFile().name=name;save()});
deleteFileBtn.onclick=()=>{
  if(state.files.length===1){alert('ファイルは最低1つ必要です。');return}
  if(!confirm(`「${currentFile().name}」を削除しますか？ 中の単語帳も削除されます。`))return;
  state.files=state.files.filter(f=>f.id!==activeFileId);activeFileId=state.files[0].id;activeListId=state.files[0].lists[0].id;viewMode='list';save()
};
addListBtn.onclick=()=>openName('単語帳リストを作成','',name=>{const l=makeList(name);currentFile().lists.push(l);activeListId=l.id;viewMode='list';save()});
function openListMenu(id){
  const l=currentFile().lists.find(x=>x.id===id);
  const choice=prompt(`単語帳「${l.name}」\n1 = 名前変更\n2 = 削除\n\n数字を入力`);
  if(choice==='1')openName('単語帳名を変更',l.name,name=>{l.name=name;save()});
  if(choice==='2'){
    if(currentFile().lists.length===1){alert('単語帳は最低1つ必要です。');return}
    if(confirm(`「${l.name}」を削除しますか？`)){currentFile().lists=currentFile().lists.filter(x=>x.id!==id);ensureActive();viewMode='list';save()}
  }
}
nameSaveBtn.onclick=()=>{const n=nameInput.value.trim();if(!n||!nameAction)return;nameAction(n);nameDialog.close();nameAction=null};
fileStar1Btn.onclick=()=>{viewMode='star1';searchInput.value='';render()};
fileStar2Btn.onclick=()=>{viewMode='star2';searchInput.value='';render()};

/* import */
importBtn.onclick=()=>{if(viewMode!=='list')return;importText.value='';importDialog.showModal()};
doImportBtn.onclick=()=>{
  const l=currentList(),rows=parseImport(importText.value),seen=new Set(l.words.map(w=>w.en.toLowerCase()));let added=0;
  rows.forEach(r=>{if(!seen.has(r.en.toLowerCase())){l.words.push({id:uid(),...r,star:0});seen.add(r.en.toLowerCase());added++}});
  importDialog.close();save();alert(`${added}語を追加しました。`)
};
searchInput.oninput=render;

/* flashcards */
flashBtn.onclick=()=>{
  flashState.items=shuffle(wordsForView());flashState.index=0;
  flashScopeName.textContent=`${currentFile().name} / ${viewMode==='list'?currentList().name:(viewMode==='star1'?'★1 統合':'★★ 統合')}`;
  flashDialog.showModal();showFlash()
};
function showFlash(){
  const ok=flashState.items.length>0;
  flashEmpty.classList.toggle('hidden',ok);flashArea.classList.toggle('hidden',!ok);if(!ok)return;
  const w=flashState.items[flashState.index];flashCard.classList.remove('flipped');
  flashWord.textContent=w.en;flashJp.textContent=w.jp;flashEx.textContent=w.example||'';
  flashProgress.textContent=`${flashState.index+1} / ${flashState.items.length}`;
  flashStar1.className=w.star>=1?'star-on':'star-off';flashStar2.className=w.star>=2?'star-on':'star-off';
  if(autoSpeak.checked)setTimeout(()=>speak(w.en),100)
}
flashCard.onclick=()=>flashCard.classList.toggle('flipped');
flashAudioBtn.onclick=e=>{e.stopPropagation();const w=flashState.items[flashState.index];if(w)speak(w.en)};
prevFlashBtn.onclick=()=>{if(!flashState.items.length)return;flashState.index=(flashState.index-1+flashState.items.length)%flashState.items.length;showFlash()};
nextFlashBtn.onclick=()=>{if(!flashState.items.length)return;flashState.index=(flashState.index+1)%flashState.items.length;showFlash()};
shuffleFlashBtn.onclick=()=>{flashState.items=shuffle(flashState.items);flashState.index=0;showFlash()};
flashStar1.onclick=()=>{const w=flashState.items[flashState.index];if(w)setStar(w.id,w.listId,1)};
flashStar2.onclick=()=>{const w=flashState.items[flashState.index];if(w)setStar(w.id,w.listId,2)};
function refreshFlash(id,listId){
  if(!flashState.items.length)return;
  const cur=flashState.items[flashState.index],fresh=findStoredWord(id,listId);
  if(cur&&fresh&&cur.id===id&&cur.listId===listId){cur.star=fresh.star;flashStar1.className=fresh.star>=1?'star-on':'star-off';flashStar2.className=fresh.star>=2?'star-on':'star-off'}
}

/* test */
testBtn.onclick=()=>{testDialog.showModal();testEmpty.classList.remove('hidden');testBox.classList.add('hidden')};
startTestBtn.onclick=()=>{
  const pool=wordsForView();
  if(pool.length<4){alert('4択テストには対象単語が4語以上必要です。');return}
  const qs=shuffle(pool).slice(0,Math.min(20,pool.length)).map(ans=>({answer:ans,choices:shuffle([ans,...shuffle(pool.filter(w=>w.id!==ans.id)).slice(0,3)]),sentence:makeSentence(ans)}));
  testState={questions:qs,index:0,score:0,answered:false};testEmpty.classList.add('hidden');testBox.classList.remove('hidden');showQ()
};
function showQ(){
  const q=testState.questions[testState.index];testProgress.textContent=`${testState.index+1} / ${testState.questions.length}`;
  sentence.textContent=q.sentence;feedback.textContent='';nextQBtn.classList.add('hidden');choices.innerHTML='';
  q.choices.forEach((w,i)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<b>${String.fromCharCode(65+i)}. ${esc(w.en)}</b><div class="muted">${esc(w.jp)}</div>`;b.onclick=()=>answerQ(b,w,q);choices.appendChild(b)})
}
function answerQ(btn,w,q){
  if(testState.answered)return;testState.answered=true;
  [...choices.children].forEach(b=>{if(b.textContent.includes(q.answer.en))b.classList.add('correct')});
  if(w.id===q.answer.id){testState.score++;feedback.textContent='正解！'}else{btn.classList.add('wrong');feedback.textContent=`不正解。正解は ${q.answer.en}（${q.answer.jp}）`}
  nextQBtn.classList.remove('hidden')
}
nextQBtn.onclick=()=>{
  testState.index++;testState.answered=false;
  if(testState.index>=testState.questions.length){sentence.textContent=`終了：${testState.score} / ${testState.questions.length} 正解`;choices.innerHTML='';feedback.textContent='';nextQBtn.classList.add('hidden');testProgress.textContent='';return}
  showQ()
};

/* backup */
exportBtn.onclick=()=>{const txt=JSON.stringify(state);navigator.clipboard?.writeText(txt).then(()=>alert('バックアップJSONをコピーしました。')).catch(()=>prompt('コピーしてください',txt))};
restoreBtn.onclick=()=>{restoreText.value='';restoreDialog.showModal()};
doRestoreBtn.onclick=()=>{try{const x=JSON.parse(restoreText.value);if(!x||!Array.isArray(x.files)||!x.files.length)throw 0;state=x;activeFileId=state.files[0].id;activeListId=state.files[0].lists[0].id;viewMode='list';localStorage.setItem(KEY,JSON.stringify(state));restoreDialog.close();render();alert('復元しました。')}catch(e){alert('バックアップ形式が正しくありません。')}};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).close());
if('speechSynthesis' in window){speechSynthesis.getVoices()}
if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
render();
</script>
