<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VocabStar 修復</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f7fb;color:#111827}
.wrap{max-width:520px;margin:18vh auto;padding:24px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
h1{font-size:22px;margin:0 0 10px}
p{line-height:1.6;color:#4b5563}
#status{font-weight:700;color:#2563eb}
button{border:0;border-radius:12px;background:#2563eb;color:#fff;padding:11px 16px;font-size:16px;font-weight:700}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>VocabStarを更新しています</h1>
<p id="status">古いキャッシュを解除中…</p>
<button id="retry" hidden>もう一度試す</button>
</div></div>
<script>
const statusEl=document.getElementById('status');
const retry=document.getElementById('retry');

function setStatus(s){statusEl.textContent=s}

async function waitForActive(reg){
  if(reg.active && reg.active.state==='activated') return;
  const worker=reg.installing||reg.waiting;
  if(!worker) return;
  await new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>reject(new Error('activation timeout')),15000);
    worker.addEventListener('statechange',()=>{
      if(worker.state==='activated'){
        clearTimeout(timer); resolve();
      }
      if(worker.state==='redundant'){
        clearTimeout(timer); reject(new Error('worker redundant'));
      }
    });
  });
}

async function repair(){
  retry.hidden=true;
  try{
    setStatus('古いService Workerを解除中…');
    const regs=await navigator.serviceWorker.getRegistrations();
    for(const r of regs){
      if(r.scope.includes('/world-heritage-quiz/vocab/')) await r.unregister();
    }

    setStatus('古いキャッシュを削除中…');
    const keys=await caches.keys();
    await Promise.all(keys.filter(k=>k.startsWith('vocabstar-cache-')).map(k=>caches.delete(k)));

    setStatus('最新版を強制登録中…');
    const reg=await navigator.serviceWorker.register('./sw.js?v=16-force-2',{
      scope:'./',
      updateViaCache:'none'
    });
    try{ await reg.update(); }catch(e){}
    await waitForActive(reg);
    await navigator.serviceWorker.ready;

    setStatus('更新完了。VocabStarを開きます…');
    setTimeout(()=>{
      location.replace('./?v=16-force-2-'+Date.now());
    },700);
  }catch(e){
    console.error(e);
    setStatus('自動更新に失敗しました。下のボタンでもう一度試してください。');
    retry.hidden=false;
  }
}
retry.onclick=repair;
repair();
</script>
</body>
</html>
